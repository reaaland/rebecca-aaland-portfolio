<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Majerus Outdoor Services website project preview</title>
  <desc id="desc">A professional steel-blue, concrete-gray, white, and orange project visual for the Majerus Outdoor Services website.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172838"/>
      <stop offset=".6" stop-color="#324d62"/>
      <stop offset="1" stop-color="#587185"/>
    </linearGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
