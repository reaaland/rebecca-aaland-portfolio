      <circle cx="18" cy="15" r="1.2" fill="#fff" opacity=".025"/>
      <path d="M0 23L23 0" stroke="#fff" stroke-width=".6" opacity=".02"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0a141d" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#e7eaec"/>
  <rect x="42" y="36" width="1116" height="688" rx="24" fill="#f7f7f5" stroke="#cfd5d9" filter="url(#shadow)"/>

